<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Auto Answer</title>
  <style>
    body {
      width: 360px;
      min-height: 320px;
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      color: #0f172a;
    }

    .header {
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      color: #0f172a;
    }

    .header p {
      margin: 4px 0 0;
      font-size: 12px;
      color: #64748b;
    }

    .metric {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #f1f5f9;
    }

    .metric:last-child {
      border-bottom: none;
    }

    .metric-label {
      font-size: 13px;
      color: #475569;
    }

    .metric-value {
      font-size: 13px;
      font-weight: 600;
      color: #0f172a;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
    }

    .badge-success {
      background: #ecfdf5;
      color: #065f46;
    }

    .badge-info {
      background: #eff6ff;
      color: #1e40af;
    }

    #status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }

    #status.success {
      display: block;
      background: #ecfdf5;
      color: #065f46;
    }

    #status.error {
      display: block;
      background: #fef2f2;
      color: #991b1b;
    }

    .launcher {
      margin-top: 20px;
      padding: 16px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #f8fafc;
    }

    .launcher h2 {
      margin: 0 0 12px 0;
      font-size: 14px;
      font-weight: 600;
      color: #0f172a;
    }

    .launcher p {
      margin: 0 0 12px 0;
      font-size: 12px;
      color: #475569;
      line-height: 1.5;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      background: #0f172a;
      color: #fff;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>AI Auto Answer</h1>
    <p>Extension overview</p>
  </div>

  <div class="metric">
    <span class="metric-label">CodeMentor</span>
    <span class="metric-value badge badge-success">Active</span>
  </div>

  <div class="metric">
    <span class="metric-label">Upwork</span>
    <span class="metric-value badge badge-success">Active</span>
  </div>

  <div class="metric">
    <span class="metric-label">Saved responses</span>
    <span class="metric-value" id="responseCount">-</span>
  </div>

  <div class="metric">
    <span class="metric-label">Provider</span>
    <span class="metric-value" id="providerStatus">-</span>
  </div>

  <div id="status"></div>

  <div class="launcher">
    <h2>Manual Mode</h2>
    <p>Generate AI responses on any website. Opens a floating card on the current page.</p>
    <button id="openManualBtn" class="btn">Open Manual Mode</button>
  </div>

  <script src="dist/popup.js"></script>
</body>
</html>
