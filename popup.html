<!DOCTYPE html>
<html>
<head>
  <title>AI Auto Answer</title>
  <style>
    body {
      width: 360px;
      min-height: 420px;
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      color: #0f172a;
    }

    .header {
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      color: #0f172a;
    }

    .header p {
      margin: 4px 0 0;
      font-size: 12px;
      color: #64748b;
    }

    .metric {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #f1f5f9;
    }

    .metric:last-child {
      border-bottom: none;
    }

    .metric-label {
      font-size: 13px;
      color: #475569;
    }

    .metric-value {
      font-size: 13px;
      font-weight: 600;
      color: #0f172a;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
    }

    .badge-success {
      background: #ecfdf5;
      color: #065f46;
    }

    .badge-info {
      background: #eff6ff;
      color: #1e40af;
    }

    #status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }

    #status.success {
      display: block;
      background: #ecfdf5;
      color: #065f46;
    }

    #status.error {
      display: block;
      background: #fef2f2;
      color: #991b1b;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>AI Auto Answer</h1>
    <p>Extension overview</p>
  </div>

  <div class="metric">
    <span class="metric-label">CodeMentor</span>
    <span class="metric-value badge badge-success">Active</span>
  </div>

  <div class="metric">
    <span class="metric-label">Upwork</span>
    <span class="metric-value badge badge-success">Active</span>
  </div>

  <div class="metric">
    <span class="metric-label">Saved responses</span>
    <span class="metric-value" id="responseCount">-</span>
  </div>

  <div class="metric">
    <span class="metric-label">Provider</span>
    <span class="metric-value" id="providerStatus">-</span>
  </div>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
